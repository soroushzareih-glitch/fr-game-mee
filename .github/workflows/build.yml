name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          npx cap init "FR_GAME ME" com.frgame.me --web-dir=www
          npx cap add android
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          npx cap sync
          cd android && chmod +x gradlew && ./gradlew assembleRelease && cd ..
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore release.jks -alias frgame -keyalg RSA -keysize 2048 -validity 10000 -storepass frgame2900 -keypass frgame2900 -dname "CN=FR_GAME, O=FR_GAME, C=IR"
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias frgame --ks-pass pass:frgame2900 --key-pass pass:frgame2900 --out FR_GAME.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FR_GAME-apk
          path: FR_GAME.apk
